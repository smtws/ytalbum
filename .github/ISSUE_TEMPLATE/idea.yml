name: Idea
description: Something ytalbum should do, or do differently
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to get done
      description: The concrete case behind it — a playlist that files badly, a step you repeat by hand. Cases beat feature names; they usually reveal a simpler fix.
    validations:
      required: true
