[project]
name = "ytalbum"
version = "0.9.1"
description = "Turn YouTube playlists into properly tagged Opus albums"
authors = [
    { name = "Tordt", email = "info@smt-webservices.de" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.0",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "yt-dlp[default]>=2026.8.19",
]

# Everything a timing provider needs, and nothing the rest of ytalbum imports. Install it only if
# you want the `local` provider (or are running `ytalbum timing-serve` for another machine):
#     uv pip install "ytalbum[timing]"
# On a machine without a usable GPU, ask for the small CPU build of torch first — it is ~200 MB
# against some 4 GB of CUDA libraries, and the aligner runs perfectly well on a processor:
#     uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
[project.optional-dependencies]
timing = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "demucs>=4.0.1",
    # demucs imports numpy at module level and does not declare it (demucs/transformer.py), so a
    # clean `uv sync --extra timing` installed the extra and still could not load the provider
    "numpy>=1.26",
    # writing the separated voice to a file for a transcriber to hear (§9.45)
    "soundfile>=0.12",
]
# A second opinion on every alignment, and the ability to draft words for a track that has none.
# It carries a Whisper decoder — **3.09 GB of model on first use** — and is worth it only if you
# want alignments checked without listening to them, or transcription without a paid provider:
#     uv pip install "ytalbum[timing,timing-check]"
# On CUDA, ctranslate2 wants CUDA 12's libcublas while torch may bring a different one; ytalbum
# falls back to the processor and says so, and `uv pip install nvidia-cublas-cu12 nvidia-cudnn-cu12`
# puts the GPU back. On a machine without one it is simply slower (about 2x real time).
timing-check = [
    "faster-whisper>=1.1",
    "stable-ts>=2.19",
]

[project.scripts]
ytalbum = "ytalbum:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    # The end-to-end corpus (tests/test_corpus_audio.py): real audio, real models, minutes not
    # milliseconds. Opt in with YTALBUM_CORPUS_AUDIO=1; it is skipped otherwise, so `uv run pytest`
    # stays offline and fast.
    "slow: runs real models on real audio, opt-in via YTALBUM_CORPUS_AUDIO",
]

[tool.ruff]
line-length = 127  # the code is hand-formatted; this only bounds it, `ruff format` is not used

[tool.ruff.lint]
# Hygiene, not style: unused and shadowed names, import order, obvious mistakes.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings: the fixtures and titles are full of real ones
    "RUF003",
    "RUF059",  # unused unpacked variable: `_, title = parse(...)` reads better than indexing
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported to be used by name, which every linter reads as unused
"tests/*" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["ytalbum"]
