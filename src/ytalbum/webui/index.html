<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytalbum</title>
  <meta name="theme-color" content="#1d1b22">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <h1><img src="/icon.svg" alt="" width="24" height="24"> ytalbum</h1>
    <form id="open" class="open" autocomplete="off">
      <input id="q" name="q" type="text" placeholder="Paste a YouTube playlist, video or channel URL — or type an artist" aria-label="URL or artist">
      <button type="submit">Go</button>
    </form>
    <label class="login" title="Use this browser's YouTube login (cookies) — helps against YouTube's bot check and for age-restricted videos">
      YouTube login <select id="browser"><option value="">none</option></select>
    </label>
    <button id="update" class="quiet" type="button" title="Check every album against its source">Update library</button>
    <button id="theme" class="quiet theme" type="button" title="Theme: automatic">◐</button>
  </header>

  <div id="offline" class="activity offline" hidden role="alert">
    <span class="dot"></span><strong>The ytalbum server is not reachable.</strong>
    <span class="muted">Start it with <code>ytalbum serve</code> (or install it: <code>ytalbum service install</code>). Retrying…</span>
  </div>
  <div id="activity" class="activity" hidden aria-live="polite"></div>
  <main>
    <section id="results" class="panel" hidden></section>
    <section id="album" class="panel" hidden></section>
    <section>
      <div class="section-head"><h2>Library</h2><span id="libpath" class="muted"></span></div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted" hidden>Nothing here yet. Paste a playlist URL or type an artist above.</p>
    </section>
  </main>

  <footer id="player" class="player" hidden>
    <img id="p-cover" class="p-cover" alt="">
    <div class="p-info"><div id="p-title" class="p-title"></div><div id="p-artist" class="muted p-artist"></div></div>
    <div class="p-controls">
      <button id="p-prev" class="quiet icon" type="button" title="Previous" aria-label="Previous">⏮</button>
      <button id="p-play" class="icon big" type="button" title="Play/pause" aria-label="Play/pause">⏸</button>
      <button id="p-next" class="quiet icon" type="button" title="Next" aria-label="Next">⏭</button>
    </div>
    <div class="p-seek"><span id="p-time" class="muted">0:00</span><input id="p-pos" type="range" min="0" max="1000" value="0" aria-label="Position"><span id="p-dur" class="muted">0:00</span></div>
    <audio id="audio" preload="auto"></audio>
  </footer>
  <aside id="jobs" class="jobs"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
