<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytalbum</title>
  <meta name="theme-color" content="#1d1b22">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <h1><img src="/icon.svg" alt="" width="24" height="24"> ytalbum</h1>
    <form id="open" class="open" autocomplete="off">
      <input id="q" name="q" type="text" placeholder="Paste a YouTube playlist, video or channel URL — or type an artist" aria-label="URL or artist">
      <button type="submit">Go</button>
    </form>
    <button id="update" class="quiet" type="button" title="Check every album against its source (unchanged albums cost one request). Shift+click reads every album in full.">Update library</button>
    <button id="theme" class="quiet theme" type="button" title="Theme: automatic">◐</button>
    <button id="gear" class="quiet theme" type="button" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <div id="offline" class="activity offline" hidden role="alert">
    <span class="dot"></span><strong>The ytalbum server is not reachable.</strong>
    <span class="muted">Start it with <code>ytalbum serve</code> (or install it: <code>ytalbum service install</code>). Retrying…</span>
  </div>
  <div id="activity" class="activity" hidden aria-live="polite"></div>
  <main>
    <section id="settings" class="panel" hidden></section>
    <section id="results" class="panel" hidden></section>
    <section id="album" class="panel" hidden></section>
    <section>
      <div class="section-head"><h2 id="libtitle">Library</h2><span id="libpath" class="muted"></span>
        <input id="libfilter" class="libfilter" type="search" placeholder="Filter the library…  (/)"
               aria-label="Filter the library by album or artist" autocomplete="off" spellcheck="false">
        <span id="artist-actions" class="artist-actions" hidden>
          <button id="artist-new" class="quiet" type="button" title="Search YouTube for this artist — albums you already have are marked">Check for new albums</button>
          <button id="artist-update" class="quiet" type="button" title="Re-check only this artist's albums against their sources">Update these albums</button>
          <button id="artist-all" class="quiet" type="button">Show all artists</button>
        </span>
      </div>
      <div id="grid" class="grid"></div>
      <p id="empty" class="muted" hidden>Nothing here yet. Paste a playlist URL or type an artist above.</p>
    </section>
  </main>

  <footer id="player" class="player" hidden>
    <img id="p-cover" class="p-cover" alt="">
    <div class="p-info"><div id="p-title" class="p-title"></div><div id="p-artist" class="muted p-artist"></div></div>
    <div class="p-controls">
      <button id="p-prev" class="quiet icon" type="button" title="Previous" aria-label="Previous">⏮</button>
      <button id="p-play" class="icon big" type="button" title="Play/pause" aria-label="Play/pause">⏸</button>
      <button id="p-next" class="quiet icon" type="button" title="Next" aria-label="Next">⏭</button>
    </div>
    <div class="p-seek">
      <span id="p-time" class="muted">0:00</span>
      <div id="p-trim" class="p-bar">
        <div class="p-line"></div>
        <div id="p-keep" class="p-keep" hidden></div>
        <input id="p-pos" type="range" min="0" max="1000" value="0" aria-label="Position">
        <button id="p-h-start" class="p-handle" type="button" hidden title="Drag: where the song starts" aria-label="Trim start"></button>
        <button id="p-h-end" class="p-handle end" type="button" hidden title="Drag: where the song ends" aria-label="Trim end"></button>
      </div>
      <span id="p-dur" class="muted">0:00</span>
      <span id="p-trim-actions" class="p-trim-actions" hidden>
        <button id="p-set-start" class="quiet small" type="button" title="Cut everything before the current position">start here</button>
        <button id="p-set-end" class="quiet small" type="button" title="Stop at the current position">end here</button>
        <button id="p-trim-clear" class="quiet small" type="button" title="Remove the trim">reset</button>
        <button id="p-trim-save" class="small" type="button" title="Save the trim for this track">save trim</button>
      </span>
    </div>
    <audio id="audio" preload="auto"></audio>
  </footer>
  <aside id="jobs" class="jobs"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
